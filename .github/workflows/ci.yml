name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Uji (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            tracer-mvp/package-lock.json
            viewer/package-lock.json
            mcp-sidecar/package-lock.json

      - name: Uji tracer (M1, dengan Lightpanda 1.0.2 asli)
        working-directory: tracer-mvp
        env:
          LIGHTPANDA_DISABLE_TELEMETRY: "true"
          LP_BIN: ${{ github.workspace }}/tracer-mvp/vendor/lightpanda
        run: |
          npm ci
          ./scripts/download-lightpanda.sh
          npm test

      - name: Uji penampil (M2)
        working-directory: viewer
        run: |
          npm ci
          npm run check
          npm run build
          npm test

      - name: Uji sidecar MCP (M3)
        working-directory: mcp-sidecar
        run: |
          npm ci
          npm test

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        image: [tracer, viewer, mcp-sidecar]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (tanpa push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: false
          tags: lp-trace-${{ matrix.image }}:ci
